name: Build and verify macOS app
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify power recovery and safety policy
        run: ./Scripts/test.sh
      - name: Verify update validation and native Installer handoff
        run: ./Scripts/test-updater.sh
      - name: Build Universal macOS app
        run: ./Scripts/build.sh
      - name: Verify helper launch paths and signature
        run: python3 Scripts/test-installation.py
      - name: Verify bounded MCP memory under repeated requests
        run: python3 Scripts/test-mcp-memory.py dist/pika.app/Contents/MacOS/pika-mcp
      - name: Verify MCP connection and parent-exit cleanup
        run: python3 Scripts/test-mcp-lifecycle.py dist/pika.app/Contents/MacOS/pika-mcp
      - name: Package disk image
        run: ./Scripts/package.sh
      - name: Verify multilingual website
        run: |
          python3 Scripts/test-site.py
          python3 Scripts/test-ai-docs.py
          node --check docs/site.js
          node --check docs/downloads.js
          node Scripts/test-web-additions.cjs
      - name: Build administrator installer packages
        run: ./Scripts/package-helper.sh
      - name: Verify full installer and process preflight
        run: python3 Scripts/test-installer-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: pika
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.pkg
            dist/SHA256SUMS-pkg.txt
            dist/SHA256SUMS.txt
